<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>3D Village - Robot Tractor V8</title>
<style>
  :root{color-scheme: dark;}
  html,body{height:100%;margin:0;overflow:hidden;background:#11151c;font-family:sans-serif;touch-action:none;}
  body{position:fixed;left:0;top:0;margin:0;transform-origin:0 0;}
  canvas{display:block;}
  #lookLayer{position:fixed;inset:0;z-index:5;touch-action:none;-webkit-tap-highlight-color:transparent;}

  #joyOuter{
    position:fixed;left:26px;bottom:calc(26px + env(safe-area-inset-bottom,0px));
    width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.4);
    z-index:10;touch-action:none;
  }
  #joyKnob.run{background:#ffb703;}
  #joyOuter.lock{border-color:#ffb703;box-shadow:0 0 16px #ffb703;}
  #joyKnob{
    position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  #rightCtrl{
    position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:12px;z-index:10;
  }
  .ctrlBtn{
    width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.82);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
  }
  #jumpBtn{background:rgba(20,20,20,0.45);border:2px solid rgba(255,255,255,0.85);box-shadow:0 0 0 2px rgba(0,0,0,0.25),0 3px 8px rgba(0,0,0,0.4);}
  .ctrlBtn.active{background:rgba(255,255,255,1);border-color:#222;}
  .ctrlBtn:active{transform:scale(0.92);}
  .ctrlBtn,.hbtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  #loading{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;background:rgba(0,0,0,0.8);padding:15px 25px;border-radius:10px;
    font-size:14px;z-index:20;
  }

  #home{position:fixed;inset:0;z-index:30;pointer-events:none;font-family:sans-serif;color:#fff;}
  #home *{pointer-events:auto;}
  body:not(.inHome) #home{display:none;}
  body.inHome #lookLayer, body.inHome #joyOuter, body.inHome #rightCtrl, body.inHome #homeBack{display:none;}
  .hbtn{border:1px solid rgba(255,255,255,0.45);background:rgba(20,28,48,0.8);color:#fff;font-weight:bold;border-radius:10px;user-select:none;}

  #charBtn,#rwBtn{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));width:52px;height:52px;padding:0;border:2px solid #ffc800;border-radius:8px;background:rgba(10,10,10,.88);box-shadow:0 0 8px #ffc800,inset 0 0 6px rgba(255,200,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8.5px;line-height:1.05;text-align:center;font-weight:900;color:#fff;text-transform:uppercase;}
  #charBtn{top:calc(12px + env(safe-area-inset-top,0px));} #rwBtn{top:calc(72px + env(safe-area-inset-top,0px));}
  #charBtn.open{background:#3a2d00;}
  #charPanel{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(72px + env(safe-area-inset-left,0px));max-width:62%;max-height:calc(100% - 80px);overflow:auto;background:rgba(10,15,30,0.88);border:1px solid rgba(255,255,255,0.3);border-radius:12px;padding:10px;display:none;}
  #charPanel.open{display:block;}
  #charGrid{display:grid;grid-template-columns:repeat(3,92px);gap:8px;}
  .cbox{width:92px;padding:4px;border-radius:10px;border:2px solid rgba(255,255,255,0.25);background:#141c32;color:#fff;font-size:11px;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .cbox img{width:100%;height:auto;border-radius:6px;display:block;}
  .cbox.sel{border-color:#ffb703;box-shadow:0 0 10px #ffb703;}
  #playBtn{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:150px;padding:8px 0;font-size:22px;font-weight:900;letter-spacing:2px;border:2px solid #3a2a00;outline:1px solid #ffe066;border-radius:3px;color:#2b1a00;background:linear-gradient(#fff27a,#ffc107 55%,#f2a900);box-shadow:0 0 14px rgba(255,200,0,0.6),0 4px 12px rgba(0,0,0,0.6);}
  #playBtn:disabled{filter:grayscale(1);opacity:0.6;}
  #playBtn:active{transform:scale(0.95);}
  #homeBack{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(118px + env(safe-area-inset-left,0px));z-index:15;width:36px;height:36px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(20,28,40,.88);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;touch-action:none;}
  #homeDrag{position:absolute;inset:0;touch-action:none;}
  #joyOuter.ready{border-color:#ffb703;}
  #wallet{position:absolute;top:0;right:0;height:42px;padding:0 calc(16px + env(safe-area-inset-right,0px)) 0 20px;display:flex;align-items:center;gap:8px;font:900 17px 'Arial Narrow',sans-serif;letter-spacing:.5px;isolation:isolate;pointer-events:none !important;}
  #wallet::before{content:"";position:absolute;inset:0;z-index:-1;background:#0a0a0a;border-left:2px solid #ffc800;border-bottom:2px solid #ffc800;box-shadow:-2px 2px 12px rgba(255,200,0,.7);}
  #wallet i{width:26px;height:26px;border-radius:50%;border:2px solid #fff0a0;background:radial-gradient(circle at 35% 30%,#fff3a0,#f5b800 55%,#b27800);display:grid;place-items:center;font:900 14px sans-serif;color:#7a4b00;}
  #coinN{color:#ffc800;min-width:150px;} #wallet .t{color:#ffc800;font-size:20px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,200,0,.7);margin-right:4px;} #wallet u{width:1px;height:22px;background:rgba(255,255,255,.3);margin:0 8px;}

  #rwPage,#stPage{position:absolute;inset:0;background:#fff;display:none;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px;box-sizing:border-box;}
  #rwPage.open,#stPage.open{display:block;}
  .rwHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:20px;font-weight:900;color:#222;}
  .rwRow{display:flex;align-items:center;gap:10px;background:#141c32;border:1px solid rgba(255,255,255,0.25);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:bold;}
  .rwRow span{flex:1;} .rwRow button{padding:8px 16px;font-size:14px;} .rwRow button:disabled{opacity:.45;}
  #rwPage.open ~ #playBtn,#stPage.open ~ #playBtn{display:none;}
  #stBtn{pointer-events:auto!important;width:30px;height:30px;padding:0;margin-left:4px;border:0;background:none;display:grid;place-items:center;} #stBtn path{fill:#ffc800;}
  .stH{color:#222;font:bold 16px sans-serif;margin:6px 0 14px;} #stOpts{display:flex;gap:14px;flex-wrap:wrap;padding:0 8px;}
  .stO{width:80px;padding:7px 3px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:#141c32;color:#fff;font:bold 10px sans-serif;text-align:center;position:relative;transition:transform .15s;}
  .stO.sel{transform:scale(1.14);border-color:#ffc800;background:#1d2747;} .stO.sel::after{content:"";position:absolute;left:12%;right:12%;bottom:-3px;height:4px;border-radius:3px;background:#ffc800;box-shadow:0 0 8px #ffc800;}
  #tractorArrows{position:fixed;left:calc(30px + env(safe-area-inset-left,0px));bottom:24px;display:none;gap:16px;pointer-events:none;}
  #tractorArrows button{width:84px;height:84px;padding:0;border-radius:50%;border:3px solid #fff;background:rgba(20,28,40,.78);display:grid;place-items:center;} #tractorArrows button.on{background:rgba(255,183,3,.85);}
  body.st1 #tractorArrows{display:flex;} body.st1 #tractorSteerWrap,body.tsOpen #tractorArrows{display:none!important;} body.st2 #tractorSteerWheel{pointer-events:none!important;}
  #quitDlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;font-family:sans-serif;}
  #quitDlg.show{display:flex;}
  #quitDlg .qbox{background:#141c32;border:2px solid #ffb703;border-radius:14px;padding:20px 26px;color:#fff;text-align:center;max-width:80%;}
  #quitDlg p{margin:0 0 16px;font-size:17px;font-weight:bold;}
  #quitDlg button{margin:0 8px;padding:10px 30px;font-size:16px;font-weight:bold;border-radius:10px;border:1px solid #fff;color:#fff;}
  #quitYes{background:#e63946;} #quitNo{background:#2b3a67;}

  #tractorEnter{
    position:fixed;right:calc(170px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));
    z-index:19;display:none;width:60px;height:60px;padding:0;border-radius:50%;
    border:2px solid #fff;background:rgba(20,28,40,.88);color:#fff;
    font-size:25px;font-weight:900;align-items:center;justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.5);touch-action:none;
  }
  body.inHome #tractorEnter, body.inHome #tractorCtrl{display:none!important;}
  #tractorCamBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(35px + env(safe-area-inset-right,0px));width:42px;height:42px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(20,28,40,.88);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5);pointer-events:auto;}
  #tractorSettingsBtn{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:calc(118px + env(safe-area-inset-left,0px));width:36px;height:36px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(20,28,40,.88);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5);}
  #tractorSettings{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));right:calc(104px + env(safe-area-inset-right,0px));width:190px;padding:7px 10px;border-radius:11px;border:1.5px solid rgba(255,255,255,.85);background:rgba(15,22,36,.92);color:#fff;font:bold 10px sans-serif;display:none;pointer-events:auto;touch-action:none;}
  body.tsOpen #tractorSteerWrap,body.tsOpen #tractorSpeedWrap,body.tsOpen #tractorBrake,body.tsOpen #tractorCamBtn{display:none !important;}
  body.tsOpen #tractorEnter{visibility:hidden;}
  #tractorSettings.open{display:block;max-height:calc(100vh - 100px);overflow-y:auto;}
  #tractorSettings *{pointer-events:auto;}
  .tsRow{margin:0 0 3px;} .tsHead{display:flex;justify-content:space-between;margin-bottom:0;}
  #tractorSettings input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;padding:0;background:transparent;outline:none;touch-action:none;}
  #tractorSettings input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#8a93aa;}
  #tractorSettings input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#8a93aa;}
  #tractorSettings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:#ffb703;border:2px solid #fff;box-shadow:0 1px 4px #000;}
  #tractorSettings input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#ffb703;border:2px solid #fff;}
  #tsSave{flex:1;width:auto;padding:4px;margin-top:2px;border-radius:7px;border:1px solid #fff;background:#1f7a3a;color:#fff;font:bold 10px sans-serif;}
  #tsReset{flex:1;width:auto;padding:4px;margin-top:2px;border-radius:7px;border:1px solid #fff;background:#2b3a67;color:#fff;font:bold 10px sans-serif;}
  #tractorCtrl{position:fixed;inset:0;z-index:16;display:none;pointer-events:none;}
  #tractorCtrl.show{display:block;}
  #tractorCtrl button,#tractorSteerWheel,#tractorSpeedRail{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;}
  #tractorSteerWrap{
    position:fixed;left:44px;bottom:20px;width:172px;height:172px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
  }
  #tractorSteerWheel{
    width:158px;height:158px;background:none;border:none;box-shadow:none;
    display:flex;align-items:center;justify-content:center;pointer-events:auto;
    transform:rotate(0deg);touch-action:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
  }
  #tractorSteerWheel svg{width:100%;height:100%;overflow:visible;pointer-events:none;}
  #tractorSpeedWrap{
    position:fixed;right:calc(30px + env(safe-area-inset-right,0px));top:calc(58px + env(safe-area-inset-top,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));
    width:52px;height:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;
    pointer-events:none;
  }
  #tractorSpeedLabel{color:#fff;font:bold 11px sans-serif;text-shadow:0 2px 4px #000;}
  #tractorSpeedRail{
    position:relative;width:38px;flex:1;min-height:170px;height:auto;border-radius:7px;
    border:2px solid rgba(255,255,255,.9);background:linear-gradient(#424a54 0,#171c22 80%,#4a1a1a 80%,#2a0e0e 100%);
    box-shadow:0 3px 12px rgba(0,0,0,.55);pointer-events:auto;touch-action:none;
  }
  #tractorSpeedFill{position:absolute;left:0;right:0;bottom:20%;height:0%;border-radius:5px;background:linear-gradient(#ffe082,#ff9800);pointer-events:none;}
  #tractorRevFill{position:absolute;left:0;right:0;top:80%;height:0%;border-radius:5px;background:linear-gradient(#ff6b6b,#d62828);pointer-events:none;}
  #tractorNeutral{position:absolute;left:0;right:0;top:80%;height:2px;background:rgba(255,255,255,.85);pointer-events:none;}
  #tractorSpeedThumb{
    position:absolute;left:50%;top:80%;width:54px;height:24px;transform:translate(-50%,-50%);
    border:2px solid #dfe4e8;border-radius:6px;background:linear-gradient(transparent 44%,rgba(0,0,0,.5) 47% 53%,transparent 56%),linear-gradient(#f7f9fa,#aab1b8 40%,#6c747c 52%,#c8ced4 78%,#838b93);box-shadow:0 2px 7px #000,inset 0 1px 1px #fff;pointer-events:none;
  }
  #plowCtrl{display:none;position:fixed;right:calc(104px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));flex-direction:column;gap:8px;}
  body.plowOn #plowCtrl{display:grid;grid-template-columns:auto;align-items:center;} body.tsOpen #plowCtrl{display:none!important;}
  #plowCtrl button{width:56px;height:50px;padding:0;border-radius:12px;border:2px solid #fff;background:rgba(20,28,40,.88);color:#fff;font:bold 11px sans-serif;line-height:1.15;box-shadow:0 3px 12px rgba(0,0,0,.5);}
  #plowCtrl button#plowDrop{background:rgba(150,30,30,.92);grid-area:1/1;}
  #plowLever{grid-area:2/1;position:relative;width:30px;height:128px;border-radius:9px;justify-self:center;border:2px solid #dfe4e8;touch-action:none;pointer-events:auto;background:linear-gradient(90deg,#4a5057,#9aa2aa 30%,#2f343a 55%,#7d858d);box-shadow:inset 0 3px 8px #000,0 3px 12px rgba(0,0,0,.5);}
  #plowKnob{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid #eef1f3;background:radial-gradient(circle at 35% 30%,#fff,#c3c9cf 35%,#6c747c 70%,#a9b0b6);box-shadow:0 3px 7px #000,inset 0 -2px 4px rgba(0,0,0,.4);transition:transform .15s;pointer-events:none;}
  #tractorBrake{pointer-events:auto;position:fixed;right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:84px;height:84px;padding:0;border-radius:10px;border:3px solid #e9edf0;transform-origin:50% 0;transition:transform .08s ease-out,filter .08s,box-shadow .08s;overflow:hidden;color:transparent;font-size:0;

    background:radial-gradient(circle,#0c0e10 0 5.2px,#5b626a 5.6px,#f4f7f9 6.4px,transparent 7px) 0 0/26px 27px,linear-gradient(135deg,#dfe4e8 0%,#9aa2aa 45%,#c9cfd5 70%,#7f878f 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.28);touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;}
  #tractorBrake:active,#tractorBrake.on{transform:perspective(220px) rotateX(24deg) translateY(3px) scale(.96);filter:brightness(.78);box-shadow:0 1px 4px rgba(0,0,0,.6),inset 0 4px 8px rgba(0,0,0,.45);}

  #miniMapWrap{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(2px + env(safe-area-inset-left,0px));
    width:112px;height:112px;border-radius:14px;overflow:hidden;
    border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 12px rgba(0,0,0,.5);
    background:#2b3a2a;z-index:14;touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  body:not(.inHome) #miniMapWrap{display:block;}
  body.inHome #miniMapWrap{display:none;}
  #miniMapCanvas{width:100%;height:100%;display:block;touch-action:none;}
  #miniMapExpand{
    position:absolute;right:3px;top:3px;width:36px;height:36px;padding:0;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85);background:rgba(10,15,25,.78);color:#fff;font-size:19px;line-height:34px;
    touch-action:none;-webkit-tap-highlight-color:transparent;z-index:1;
  }

  #miniMapBigOverlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;}
  #miniMapBigBox{position:relative;
    border-radius:0;overflow:hidden;border:2px solid rgba(255,255,255,.9);box-shadow:0 8px 30px rgba(0,0,0,.6);background:#2b3a2a;}
  #miniMapBigCanvas{width:100%;height:100%;display:block;touch-action:none;}
  #miniMapBigClose{position:absolute;top:8px;right:8px;width:36px;height:36px;padding:0;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);background:#1a1f27;color:#fff;font:bold 16px sans-serif;line-height:32px;z-index:2;
    box-shadow:0 2px 8px rgba(0,0,0,.5);}
</style>
</head>
<body class="inHome">

<div id="loading">असली 3D मॉडल लोड हो रहा है...</div>

<div id="home">
  <div id="homeDrag"></div>
  <button id="charBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#ffc800"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>Character</button>
  <div id="charPanel"><div id="charGrid"></div></div>
  <div id="wallet"><b class="t">3D VILLAGE</b><u></u><i>$</i><span>COINS</span><b id="coinN">0</b><button id="stBtn" aria-label="Settings"></button></div>
  <button id="rwBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#ffc800"><rect x="3" y="8" width="18" height="4" rx="1"/><rect x="4" y="12" width="16" height="9" rx="1"/><rect x="11" y="8" width="2" height="13" fill="#0a0a0a"/><path d="M12 8C8.5 8 7 5.5 8.6 4.4S12 5 12 8zm0 0c3.5 0 5-2.5 3.4-3.6S12 5 12 8z"/></svg>Daily Rewards</button>
  <div id="rwPage"><div class="rwHead"><button id="rwClose" class="hbtn" aria-label="Back" style="padding:6px 10px;margin-right:12px"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M20 12H5M11 6l-6 6 6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div style="flex:1">🎁 Daily Rewards</div></div><div id="rwList"></div></div>
  <div id="stPage"><div class="rwHead"><button id="stClose" class="hbtn" aria-label="Back" style="padding:6px 10px;margin-right:12px"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M20 12H5M11 6l-6 6 6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="stH">Steering</div><div id="stOpts"></div></div>
  <button id="playBtn" disabled>लोड हो रहा...</button>
</div>
<button id="homeBack" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20" style="pointer-events:none"><path fill="#fff" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
<div id="quitDlg"><div class="qbox"><p>Do you want to leave the game?</p><button id="quitYes">Yes</button><button id="quitNo">No</button></div></div>

<div id="lookLayer"></div>
<div id="joyOuter"><div id="joyKnob"></div></div>
<button id="tractorEnter" title="Enter tractor" aria-label="Enter or exit tractor">🚜</button>
<div id="tractorCtrl">
  <div id="tractorSteerWrap">
    <div id="tractorSteerWheel" aria-label="Steering wheel">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="43" fill="none" stroke="#111" stroke-width="9"/>
        <circle cx="50" cy="50" r="43" fill="none" stroke="#3a3f46" stroke-width="1.5" opacity=".8"/>

// libraries: first run downloads from the internet and saves into the app's own storage (IndexedDB); later runs use the saved copy; if it is missing/deleted they are downloaded again. Then the game script (below) runs.
(async()=>{
  const U=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js'];
  let db=null; try{ db=await new Promise((r,j)=>{ const q=indexedDB.open('v2',1); q.onupgradeneeded=()=>q.result.createObjectStore('s'); q.onsuccess=()=>r(q.result); q.onerror=j; }); }catch(e){}
  const get=k=>db?new Promise(r=>{ const q=db.transaction('s').objectStore('s').get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(); }):Promise.resolve();
  const put=(k,v)=>db?new Promise(r=>{ const t=db.transaction('s','readwrite'); t.objectStore('s').put(v,k); t.oncomplete=t.onerror=t.onabort=()=>r(); }):Promise.resolve();
  const run=t=>{ const e=document.createElement('script'); e.text=t; document.head.appendChild(e); };
  try{ for(const u of U){ let t=await get(u); if(!t){ const rs=await fetch(u); if(!rs.ok) throw 0; t=await rs.text(); await put(u,t); } run(t); } }
  catch(e){ document.getElementById('loading').textContent='लोड नहीं हो पाया, इंटरनेट जाँचें'; return; }
  if(document.readyState==='loading') await new Promise(r=>addEventListener('DOMContentLoaded',r));
  run(document.getElementById('main').textContent);
})();
</script>

  // app's own storage (IndexedDB): first run downloads from internet and saves the model; later runs load it from there

    if(!buf){ const rs=await fetch(url,{mode:'cors'}); if(!rs.ok) throw new Error('Model download failed'); buf=await rs.arrayBuffer();
      await new Promise(r=>{ const t=db.transaction('s','readwrite'); t.objectStore('s').put(buf,url); t.oncomplete=t.onerror=t.onabort=()=>r(); }); }
    return await new Promise((res,rej)=>loader.parse(buf,'',res,rej));

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if(paused){ renderer.render(scene, camera); return; }
  if(gameState==='play'){ rwDay(); rw.t+=dt; }
  { const mc=gameState==='home'?homeCh:active; if(mc) mc.mixer.update(dt); }

  if(gameState==='home'){
    if(homeCh){ if(!homeDragging){ homeSpin+=homeSpinV; homeSpinV*=0.93; }
      homeCh.model.rotation.y = homeCh.yaw + homeCh.face + homeSpin; }
    hbgUp(); renderer.render(homeScene, homeCam);
    return;
  }

  { const sh=!inTractor; if(sh!==shadowOn){ shadowOn=sh; renderer.shadowMap.autoUpdate=sh; if(!sh) renderer.shadowMap.needsUpdate=true; } }
  updateTractor(dt); mudUpdate(dt); updateTractorsWorld(dt); for(const t of tractors) tractorTerrain(t);
  if(model && !inTractor){
    const prevX=model.position.x, prevZ=model.position.z;
    const mag = Math.hypot(joyDX, joyDY);
    const moving = mag > 0.15;

    if(moving){

      const ca=camYawOffset, fx=-Math.sin(ca), fz=-Math.cos(ca), rx=Math.cos(ca), rz=-Math.sin(ca);
      const mdx=fx*(-joyDY)+rx*joyDX, mdz=fz*(-joyDY)+rz*joyDX;
      const targetYaw = Math.atan2(-mdx, -mdz);
      let diff = targetYaw - yaw;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      yaw += diff * Math.min(1, dt*8);
      const speed = (mode === 'run' ? 6.0 : 2.5) * (jumping && jumpRun ? 1.15 : 1);
      model.position.x += -Math.sin(yaw) * speed * dt;
      model.position.z += -Math.cos(yaw) * speed * dt;

      const limit = roomSize/2 - 1.5;
      model.position.x = Math.max(-limit-WX, Math.min(limit, model.position.x));
      model.position.z = Math.max(ZN+1.5, Math.min(limit, model.position.z));

      const cdx=model.position.x, cdz=model.position.z, cdist=Math.hypot(cdx,cdz), noGo=CIRC_R+0.6;
      if(cdist < noGo && cdist > 0.0001){
        const k=noGo/cdist;
        model.position.x = cdx*k; model.position.z = cdz*k;
      }

      model.rotation.y = yaw + active.face;
      if(!jumping) playAnim(mode === 'run' ? 'run' : 'walk');
    } else if(!jumping){
      playAnim('idle');
    }

    if(moving && !jumping){ stepT+=dt; const iv=mode==='run'?0.28:0.47; if(stepT>=iv){ stepT=0; Snd.step(mode==='run'); } }
    else stepT=0.25;
    if(prevJump && !jumping) Snd.land();
    prevJump=jumping;

    if(jumping) updateJump(dt);
    else model.position.y = groundH(model.position.x, model.position.z);

    collide(prevX,prevZ);
    uprightW += ((!moving && !jumping ? 1 : 0) - uprightW) * Math.min(1, dt*6);
    keepUpright(uprightW);
    jumpPose(active,dt);

    sun.position.set(model.position.x+12,25,model.position.z+12);
    sun.target.position.set(model.position.x,0,model.position.z); sun.target.updateMatrixWorld();
    const lookYaw = camYawOffset;
    if(moving) camPitch += (0 - camPitch) * Math.min(1, dt*3);
    const camR=Math.hypot(camDist, camHeight-1.8), camPhi=Math.atan2(camHeight-1.8, camDist)+camPitch;
    const targetCamPos = _t7.set(
      model.position.x + Math.sin(lookYaw) * camR*Math.cos(camPhi),
      groundH(model.position.x,model.position.z) + 1.8 + camR*Math.sin(camPhi) + (model.position.y-groundH(model.position.x,model.position.z))*0.3,
      model.position.z + Math.cos(lookYaw) * camR*Math.cos(camPhi)
    );
    camOut(targetCamPos,model.position); camPos.lerp(targetCamPos, 1 - Math.pow(0.0005, dt));
    { const gc=groundH(camPos.x,camPos.z)+1.0; if(camPos.y<gc) camPos.y=gc; }
    camOut(camPos,model.position,.3); camera.position.copy(camPos);
    camera.lookAt(model.position.x, groundH(model.position.x,model.position.z) + 1.8 + (model.position.y-groundH(model.position.x,model.position.z))*0.3, model.position.z);
  }
  reflUpdate(); renderer.render(scene, camera);
  if((mmTick=(mmTick+1)%3)===0) drawMiniMap();
}
// ---- phone Back button: closes the top-most open thing (same as the on-screen buttons); on the home page one press does nothing, a 2nd press within 2.5 s exits
// Back never leaves the page (the guard entry is put back every time), so a wrapper app can't reload the game
{ const $=id=>document.getElementById(id), pgs=[$('stPage'),$('rwPage')], ts=$('tractorSettings'); let sent=0, last=0;
  const top=()=>{ if(quitDlg.classList.contains('show')) return $('quitNo').click(),1;   // quit question -> No
    if(mmBigOpen) return closeMmBig(),1;                                                 // big map -> back to game
    if(ts.classList.contains('open')) return ts.classList.remove('open'),1;              // tyre settings
    for(const p of pgs) if(p.classList.contains('open')) return p.classList.remove('open'),1;   // Settings / Daily Rewards -> home
    if(charPanel.classList.contains('open')) return charBtn.click(),1;                   // character list -> closed
    if(gameState==='play') return $('homeBack').click(),1; };                            // in game = the small home icon (quit question)
  const push=()=>{ if(!sent){ sent=1; history.pushState({g:1},''); } };
  addEventListener('pointerdown',push,true);   // first touch arms it (browsers ignore history entries made before any touch)
  addEventListener('popstate',()=>{ sent=0; push(); if(top()) return;
    if(Date.now()-last<2500){ last=0; try{ (window.Capacitor&&Capacitor.Plugins.App||navigator.app).exitApp(); }catch(e){} try{ window.close(); }catch(e){} } else last=Date.now(); }); }   // home, nothing open: 1st press absorbed, 2nd press asks the app to close
animate();
</script>
